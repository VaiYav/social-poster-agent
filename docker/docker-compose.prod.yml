# SPA Production Docker Compose
# Usage: docker compose -f docker/docker-compose.prod.yml up -d
#
# Env vars: copy .env.example to .env and fill in real credentials.
# All ${VAR:-default} references resolve from .env or shell environment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spa
      POSTGRES_USER: spa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — internal-only (backend connects via docker network)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spa"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # No ports exposed — internal-only (backend connects via docker network)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://spa:${POSTGRES_PASSWORD:-spa_dev}@postgres:5432/spa
      REDIS_URL: redis://redis:6379
      # Ports (override from .env if needed)
      PORT: "3100"
      SPA_API_PORT: "3100"
      SPA_UI_PORT: "3101"
      # Content paths (mounted volume for blog/brief/topics)
      BLOG_DIR: ${BLOG_DIR:-/data/blog}
      BRIEF_DIR: ${BRIEF_DIR:-/data/briefs}
      TOPICS_DIR: ${TOPICS_DIR:-/data/topics}
      CREATE_RUNS_DIR: ${CREATE_RUNS_DIR:-/data/runs}
      # Quote cards output — writable volume (content mount is read-only)
      QUOTE_CARDS_DIR: ${QUOTE_CARDS_DIR:-/app/quote-cards}
      # Session encryption (P0-H3) — REQUIRED in production! Generate with: openssl rand -hex 32
      # If empty, storageState is stored in plaintext (NOT recommended for production)
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      # Cron schedules
      CRON_GENERATION_SCHEDULE: ${CRON_GENERATION_SCHEDULE:-0 9,21 * * *}
      HEALTH_MONITOR_SCHEDULE: ${HEALTH_MONITOR_SCHEDULE:-0 * * * *}
      RECONCILIATION_SCHEDULE: ${RECONCILIATION_SCHEDULE:-30 * * * *}
      # Rate limits
      RATE_LIMIT_X_MAX_PER_DAY: ${RATE_LIMIT_X_MAX_PER_DAY:-1}
      RATE_LIMIT_THREADS_MAX_PER_DAY: ${RATE_LIMIT_THREADS_MAX_PER_DAY:-1}
      RATE_LIMIT_FACEBOOK_MAX_PER_DAY: ${RATE_LIMIT_FACEBOOK_MAX_PER_DAY:-1}
      RATE_LIMIT_MIN_DELAY_MS: ${RATE_LIMIT_MIN_DELAY_MS:-3600000}
      # BullMQ
      BULLMQ_CONCURRENCY_PER_QUEUE: ${BULLMQ_CONCURRENCY_PER_QUEUE:-1}
      BULLMQ_MAX_RETRIES: ${BULLMQ_MAX_RETRIES:-3}
      BULLMQ_RETRY_DELAY_MS: ${BULLMQ_RETRY_DELAY_MS:-60000}
      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Feature flags
      ENGAGEMENT_ENABLED: ${ENGAGEMENT_ENABLED:-false}
    ports:
      - "3100:3100"
    volumes:
      - browser_data:/app/.cache/ms-playwright
      - ${CONTENT_DIR:-../content}:/data:ro
      # Quote cards output — writable (content mount is read-only)
      - quote_cards:/app/quote-cards
    # Sprint N: Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3101:3101"
    # Sprint N: Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  postgres_data:
  redis_data:
  browser_data:
  quote_cards:
